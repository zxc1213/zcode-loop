name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git identity for the loop tests
        run: |
          git config --global user.email "loop@test.local"
          git config --global user.name "Loop Test"
      - run: npm test
